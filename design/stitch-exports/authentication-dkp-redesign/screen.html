<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - DU Digital Knowledge Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Libre+Caslon+Text:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "institutional-accent": "#0D47A1",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c6c4df",
                        "surface-container-high": "#e1e8fd",
                        "secondary-fixed-dim": "#bdc7d8",
                        "slate-gray": "#4B5563",
                        "tertiary-fixed": "#e1e3e4",
                        "surface-dim": "#d3daef",
                        "surface-bright": "#f9f9ff",
                        "on-primary-container": "#83829b",
                        "surface-variant": "#dce2f7",
                        "surface-container-highest": "#dce2f7",
                        "primary": "#00000b",
                        "university-blue": "#1A1A2E",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "error": "#ba1a1a",
                        "primary-container": "#1a1a2e",
                        "primary-fixed": "#e2e0fc",
                        "on-primary-fixed": "#1a1a2e",
                        "on-secondary-container": "#596372",
                        "surface": "#f9f9ff",
                        "on-background": "#141b2b",
                        "on-surface-variant": "#47464c",
                        "on-tertiary-fixed": "#191c1d",
                        "on-primary-fixed-variant": "#45455b",
                        "on-tertiary-container": "#828485",
                        "inverse-surface": "#293040",
                        "outline": "#78767d",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#e9edff",
                        "secondary": "#555f6d",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c8c5cd",
                        "on-surface": "#141b2b",
                        "on-secondary-fixed": "#121c28",
                        "surface-container-low": "#f1f3ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#454748",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#edf0ff",
                        "tertiary-container": "#191c1d",
                        "secondary-fixed": "#d9e3f4",
                        "canvas-white": "#FFFFFF",
                        "on-secondary-fixed-variant": "#3e4755",
                        "background": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d6e0f1",
                        "tertiary": "#000001",
                        "surface-tint": "#5d5c74",
                        "inverse-primary": "#c6c4df",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "margin-mobile": "16px",
                        "base": "8px",
                        "max-width": "1280px"
                    },
                    "fontFamily": {
                        "label-sm": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-md": ["Libre Caslon Text"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg-mobile": ["Libre Caslon Text"],
                        "headline-sm": ["Libre Caslon Text"],
                        "display-lg": ["Libre Caslon Text"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-surface">
<!-- Top Navigation suppressed due to Transactional intent (Login) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="max-w-[1000px] w-full grid grid-cols-1 md:grid-cols-2 bg-canvas-white rounded-xl overflow-hidden" style="box-shadow: 0 10px 40px -10px rgba(26, 26, 46, 0.08);">
<!-- Left Branding/Image Side -->
<div class="hidden md:flex flex-col relative">
<div class="absolute inset-0 z-0" data-alt="A pristine, modern academic library interior. Sunlight streams through tall, classic architectural columns onto sleek, minimalist study desks. Deep university blue accents punctuate a bright, light-mode environment. The mood is intellectually rigorous, serene, and historically grounded yet highly advanced. High-key lighting, photorealistic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDabwisq39_cHKn8e_XVRa7NDLt-i0ijaBjd3aBi62A0KpUAp0d50My-flFX2GCa-k8FTCZzDxX6aabZfBtRmFElDNayMlnPZ2n_CfaDIt39p8j9jeOVWPFvsB8V0IHTkdk3fXAaN6lrxevXQsDA-4LwxGtVr-9qXOJRGvriRrhSWDrwekgKJrWQ3yv2gfKHt64Np8QQTdb1X9wUYt3aqjwml0EU3xmtu8S7LjvEaSS7YERXmTGlaFa')"></div>
<div class="relative z-10 p-12 h-full flex flex-col bg-university-blue/80 backdrop-blur-sm text-on-primary">
<div class="mb-auto">
<a class="inline-flex items-center gap-2 text-on-primary hover:text-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="font-label-md text-label-md">Back to Platform</span>
</a>
</div>
<div>
<h1 class="font-display-lg text-display-lg mb-4">DU Digital<br/>Knowledge Platform</h1>
<p class="font-body-lg text-body-lg text-surface-container-high max-w-md">Access the premier institutional repository for research, archives, and scholarly communication at the University of Dhaka.</p>
</div>
</div>
</div>
<!-- Right Sign In Form -->
<div class="p-8 md:p-12 lg:p-16 flex flex-col justify-center">
<!-- Mobile Branding (Hidden on Desktop) -->
<div class="md:hidden mb-8 text-center">
<h2 class="font-headline-sm text-headline-sm text-university-blue font-bold mb-2">DU DKP</h2>
<p class="font-body-md text-body-md text-slate-gray">Sign in to your account</p>
</div>
<h2 class="hidden md:block font-headline-md text-headline-md text-university-blue mb-8">Sign In</h2>
<!-- SSO Option -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded border border-slate-gray/20 bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 mb-6 font-label-md text-label-md text-on-surface">
<span class="material-symbols-outlined text-institutional-accent" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>
                    Sign in with University ID
                </button>
<div class="relative flex items-center mb-6">
<div class="flex-grow border-t border-slate-gray/20"></div>
<span class="flex-shrink-0 mx-4 text-slate-gray font-label-sm text-label-sm">OR</span>
<div class="flex-grow border-t border-slate-gray/20"></div>
</div>
<form class="space-y-5">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Institutional Email</label>
<input class="w-full bg-canvas-white border border-slate-gray/20 rounded px-4 py-3 focus:outline-none focus:ring-1 focus:ring-university-blue focus:border-university-blue transition-all" id="email" placeholder="user@du.ac.bd" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-institutional-accent hover:underline decoration-institutional-accent" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-canvas-white border border-slate-gray/20 rounded px-4 py-3 focus:outline-none focus:ring-1 focus:ring-university-blue focus:border-university-blue transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-2">
<button class="w-full bg-university-blue text-on-primary py-3 px-4 rounded font-label-md text-label-md hover:bg-institutional-accent transition-colors duration-200" type="submit">
                            Sign In
                        </button>
</div>
</form>
<p class="mt-8 text-center font-body-md text-body-md text-slate-gray">
                    New to the platform? <a class="text-institutional-accent hover:underline decoration-institutional-accent font-label-md text-label-md" href="#">Create an Account</a>
</p>
</div>
</div>
</main>
<!-- Footer suppressed due to Transactional intent (Login) -->
</body></html>
