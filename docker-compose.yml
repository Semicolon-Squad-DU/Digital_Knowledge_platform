
services:
  postgres:
    image: postgres:16-alpine
    container_name: dkp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dkp_user
      POSTGRES_PASSWORD: dkp_password
      POSTGRES_DB: dkp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/core/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dkp_user -d dkp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: dkp-elasticsearch:8.12.0-icu
    container_name: dkp_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dkp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dkp_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:stable
    container_name: dkp_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    # First boot downloads virus definitions (freshclam) before clamd will
    # accept connections — can take several minutes. start_period gives it
    # room without failing the container while that's in progress.
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  postgres_data:
  es_data:
  redis_data:
  clamav_data:
